# AURA scheduler: starts the news pipeline on time (see src/schedule.ts).
# Deployed by .github/workflows/deploy_scheduler.yml, which also sets the
# GITHUB_TOKEN secret (owner setup: docs/CLOUDFLARE.md, "Scheduler").
name = "aura-scheduler"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
# Each slot (UTC): start at :07, before GitHub's own :11 cron, and check
# again at :40 in case the first start failed. 07 UTC is the Morning Brief.
crons = ["7 7,13,17,23 * * *", "40 7,13,17,23 * * *"]

[vars]
REPO = "Adejare-ml/News-Intelligence-System"
WORKFLOW = "news_scheduler.yml"
REF = "main"
