name: Deploy test site

# main is the testing branch. Every push to it rebuilds the GitHub Pages
# copy of the site (https://adejare-ml.github.io/News-Intelligence-System/)
# so changes can be checked before anyone sees them.
#
# Production (auranews.pages.dev, the cloudflare-pages branch) is NOT
# touched here. It changes only when a version is promoted with the
# "Promote to production" workflow (promote_production.yml); after that the
# scheduler keeps production's data fresh using the promoted code.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/app/static/data/**'
      - 'web/**'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serialize deploys so two overlapping pushes cannot race on gh-pages.
# Shared with the scheduler's deploy job; the newest deploy wins.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Organisation logos are fetched from each organisation's site; the
      # cache keeps them until the list in logos.ts changes (missing ones are
      # retried on every build).
      - name: Restore logo cache
        uses: actions/cache@v6
        with:
          path: web/public/logos
          key: logos-${{ hashFiles('web/src/lib/logos.ts') }}

      - name: Build the test site
        working-directory: web
        env:
          SITES: github
        run: |
          npm ci --no-audit --no-fund
          ./scripts/build-sites.sh

      - name: Publish the test site to GitHub Pages
        # Pinned to a commit SHA so a moved tag cannot inject code into a
        # workflow that holds a contents:write token
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: web/out/github
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Smoke-test the test site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify pages and data files respond and parse
        run: |
          set -euo pipefail
          BASE="https://adejare-ml.github.io/News-Intelligence-System"

          fetch() {
            # Retry across the CDN propagation window (up to ~2 minutes).
            for i in 1 2 3 4 5 6; do
              if curl -fsSL --max-time 30 "$1" -o "$2"; then return 0; fi
              echo "attempt $i failed for $1; retrying in 20s"; sleep 20
            done
            echo "FAILED to fetch $1"; return 1
          }

          fetch "$BASE/" index.html
          grep -q "data-hero" index.html
          fetch "$BASE/register/" register.html
          grep -q "data-holding" register.html
          fetch "$BASE/brief/" brief.html
          grep -q "data-toc-section" brief.html

          # The data files stay published at their old URLs (RSS readers, scripts).
          for f in latest.json companies.json people.json procurement.json \
                   significant_control.json reports.json; do
            fetch "$BASE/data/$f" "$f"
            python3 -c "import json; json.load(open('$f'))"
            echo "OK data/$f"
          done
          fetch "$BASE/data/feed.xml" feed.xml
          echo "Smoke test passed."
