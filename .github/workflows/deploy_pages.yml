name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'backend/app/static/**'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serialize Pages deploys so two overlapping pushes cannot race on gh-pages.
# Deliberately a different group from the scheduler: sharing one would let a
# docs deploy supersede a queued ingestion run and silently skip a cycle.
# Here the newest deploy wins, so cancelling an in-progress one is safe.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy static folder to gh-pages branch
        # Pinned to a commit SHA so a moved tag cannot inject code into a
        # workflow that holds a contents:write token
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          folder: backend/app/static
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
