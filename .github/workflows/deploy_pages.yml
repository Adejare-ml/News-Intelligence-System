name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'backend/app/static/**'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serialize Pages deploys so two overlapping pushes cannot race on gh-pages.
# Deliberately a different group from the scheduler: sharing one would let a
# docs deploy supersede a queued ingestion run and silently skip a cycle.
# Here the newest deploy wins, so cancelling an in-progress one is safe.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy static folder to gh-pages branch
        # Pinned to a commit SHA so a moved tag cannot inject code into a
        # workflow that holds a contents:write token
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: backend/app/static
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

  # Nothing verified the deployed site before this: a stale asset or a 404
  # on a data file shipped silently, and the cache-buster check in tests.yml
  # is advisory. Best-effort waits cover Pages' CDN propagation delay.
  smoke-test:
    name: Smoke-test the live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify the deployed pages and data files respond and parse
        run: |
          set -euo pipefail
          BASE="https://adejare-ml.github.io/News-Intelligence-System"

          fetch() {
            # Retry across the CDN propagation window (up to ~2 minutes).
            for i in 1 2 3 4 5 6; do
              if curl -fsSL --max-time 30 "$1" -o "$2"; then return 0; fi
              echo "attempt $i failed for $1; retrying in 20s"; sleep 20
            done
            echo "FAILED to fetch $1"; return 1
          }

          fetch "$BASE/index.html" index.html
          grep -q "search-palette" index.html
          grep -q "styles.css?v=" index.html

          # The stylesheet the page actually references must be servable.
          CSS_REF=$(grep -o 'css/styles.css?v=[0-9.]*' index.html | head -1)
          fetch "$BASE/$CSS_REF" styles.css
          grep -q "\[hidden\]" styles.css

          # Every dataset the dashboard fetches on load must exist and parse.
          for f in latest.json companies.json people.json procurement.json \
                   significant_control.json reports.json graph.json agencies.json; do
            fetch "$BASE/data/$f" "$f"
            python3 -c "import json; json.load(open('$f'))"
            echo "OK data/$f"
          done

          fetch "$BASE/sitemap.xml" sitemap.xml
          fetch "$BASE/robots.txt" robots.txt
          echo "Smoke test passed."
