name: Deploy site

# Builds the Astro site in web/ and publishes two ready-built copies:
#   gh-pages          the GitHub Pages mirror, under /News-Intelligence-System/
#   cloudflare-pages  the Cloudflare Pages site (auranews.pages.dev), at the root
# Cloudflare is pointed at the cloudflare-pages branch with no build command
# (see docs/CLOUDFLARE.md). Pre-building here, rather than on Cloudflare, is
# what keeps the live site fresh: the scheduler's data commits carry
# [skip ci], which Cloudflare's own Git builds also honour.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/app/static/data/**'
      - 'web/**'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serialize deploys so two overlapping pushes cannot race on the branches.
# Shared with the scheduler's deploy job; the newest deploy wins.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build both copies
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          ./scripts/build-sites.sh

      - name: Publish the GitHub Pages copy
        # Pinned to a commit SHA so a moved tag cannot inject code into a
        # workflow that holds a contents:write token
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: web/out/github
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the Cloudflare copy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: web/out/cloudflare
          branch: cloudflare-pages
          token: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Smoke-test the GitHub Pages mirror
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify pages and data files respond and parse
        run: |
          set -euo pipefail
          BASE="https://adejare-ml.github.io/News-Intelligence-System"

          fetch() {
            # Retry across the CDN propagation window (up to ~2 minutes).
            for i in 1 2 3 4 5 6; do
              if curl -fsSL --max-time 30 "$1" -o "$2"; then return 0; fi
              echo "attempt $i failed for $1; retrying in 20s"; sleep 20
            done
            echo "FAILED to fetch $1"; return 1
          }

          fetch "$BASE/" index.html
          grep -q "data-hero" index.html
          fetch "$BASE/register/" register.html
          grep -q "data-holding" register.html
          fetch "$BASE/brief/" brief.html
          grep -q "data-toc-section" brief.html

          # The data files stay published at their old URLs (RSS readers, scripts).
          for f in latest.json companies.json people.json procurement.json \
                   significant_control.json reports.json; do
            fetch "$BASE/data/$f" "$f"
            python3 -c "import json; json.load(open('$f'))"
            echo "OK data/$f"
          done
          fetch "$BASE/data/feed.xml" feed.xml
          echo "Smoke test passed."

  # Warning-only until the Cloudflare project serves the cloudflare-pages
  # branch: before that switch the live site is the legacy dashboard and
  # these checks are expected to miss.
  smoke-test-cloudflare:
    name: Smoke-test Cloudflare (advisory)
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Verify the Cloudflare site serves the new build
        run: |
          set -uo pipefail
          BASE="https://auranews.pages.dev"
          ok=1
          check() {
            for i in 1 2 3 4 5 6; do
              if curl -fsSL --max-time 30 "$BASE$1" -o page && grep -q "$2" page; then echo "OK $1"; return 0; fi
              sleep 20
            done
            echo "::warning::Cloudflare $1 did not serve the new site (missing $2). Is the production branch set to cloudflare-pages?"
            ok=0
          }
          check "/" "data-hero"
          check "/register/" "data-holding"
          check "/data/latest.json" "Title"
          curl -fsSI --max-time 30 "$BASE/" | grep -qi "content-security-policy" \
            || { echo "::warning::Cloudflare is not sending the CSP from _headers"; ok=0; }
          [ "$ok" = 1 ]
