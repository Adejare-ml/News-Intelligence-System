name: Deploy scheduler Worker

# Deploys web/workers/scheduler, the Cloudflare Worker that starts each
# pipeline slot on time, and sets its GITHUB_TOKEN secret. Until it was
# deployed, every run came from GitHub's cron, 3.5-8 hours late, and the
# 08:00 Morning Brief went out in the afternoon. Owner setup (three repo
# secrets): docs/CLOUDFLARE.md, "Scheduler".
#
# wrangler runs through npx at a fixed major version rather than through
# cloudflare/wrangler-action, so no third-party action handles the
# Cloudflare token.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/workers/scheduler/**"]

permissions:
  contents: read

concurrency:
  group: deploy-scheduler
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
    steps:
      # Secrets cannot appear in `if:`, so this step decides for the rest.
      # A fork or a repo without the secrets gets a notice, not a red run.
      - name: Check the deploy secrets
        id: secrets
        run: |
          MISSING=""
          for NAME in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SCHEDULER_GITHUB_TOKEN; do
            [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "::notice::Scheduler Worker not deployed: missing repo secret(s):$MISSING. See docs/CLOUDFLARE.md, \"Scheduler\"."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Deploy the Worker
        if: steps.secrets.outputs.ready == 'true'
        working-directory: web/workers/scheduler
        run: npx --yes wrangler@4 deploy

      # After the deploy, so the Worker exists. Piped on stdin so the token
      # never appears in a command line or the log.
      - name: Set the Worker's GITHUB_TOKEN
        if: steps.secrets.outputs.ready == 'true'
        working-directory: web/workers/scheduler
        run: printf '%s' "$SCHEDULER_GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN
