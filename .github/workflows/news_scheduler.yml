name: AI News Intelligence Scheduler

on:
  schedule:
    # 8:00 AM, 2:00 PM, 6:00 PM, and 11:00 PM Nigeria Time (UTC+1)
    - cron: "0 7 * * *"   # 8:00 AM Nigeria Time (7:00 AM UTC)
    - cron: "0 13 * * *"  # 2:00 PM Nigeria Time (1:00 PM UTC)
    - cron: "0 17 * * *"  # 6:00 PM Nigeria Time (5:00 PM UTC)
    - cron: "0 23 * * *"  # 11:00 PM Nigeria Time (11:00 PM UTC)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  issues: write   # the failure step files/updates a pipeline-failure issue

# Serialize runs: two overlapping runs both commit to main, and the slower one
# is rejected as non-fast-forward (a manual trigger near a cron slot did exactly
# this on run 30806786258). cancel-in-progress stays false because a cancelled
# run would abandon articles mid-analysis after their LLM quota was already
# spent, and the Sheets writes are not transactional.
concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Crawler Pipeline
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          NEWSAPI_KEY_2: ${{ secrets.NEWSAPI_KEY_2 }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          NVIDIA_MODEL_FALLBACK: ${{ vars.NVIDIA_MODEL_FALLBACK }}
          SEED_DEMO_PSC: ${{ vars.SEED_DEMO_PSC || 'false' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python run_pipeline.py

      - name: Commit and Push Data Updates to Main
        # Third-party actions pinned to commit SHAs so a moved tag cannot
        # inject code into a workflow that holds a contents:write token
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "Automated AURA database updates [skip ci]"
          file_pattern: "backend/app/static/data/*"

      - name: Deploy static folder to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          folder: backend/app/static
          branch: gh-pages

      # A red run is only useful if someone sees it. The 2026-07-30 outage ran
      # for days unnoticed. Reuses a single open issue so repeated failures
      # comment rather than spam new issues.
      - name: Raise an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Idempotent: gh issue create fails if the label does not exist yet
          gh label create pipeline-failure --color B60205 \
            --description "Automated scheduler run failed" 2>/dev/null || true

          EXISTING=$(gh issue list --label pipeline-failure --state open \
            --json number --jq '.[0].number // empty')
          BODY="The scheduled pipeline failed.

          **Run:** $RUN_URL
          **Commit:** \`${{ github.sha }}\`
          **Trigger:** ${{ github.event_name }}

          Check the \`Run Crawler Pipeline\` step first. A \`LLMCascadeError\` means every
          configured LLM provider failed and nothing was published — that is the guard
          working, not data loss. A push rejection instead means the data was generated
          but a concurrent run committed first."

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "Pipeline failure: scheduled run did not complete" \
              --label pipeline-failure \
              --body "$BODY"
          fi
