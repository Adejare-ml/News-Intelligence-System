name: AI News Intelligence Scheduler

on:
  schedule:
    # 8:00 AM, 2:00 PM, 6:00 PM, and 11:00 PM Nigeria Time (UTC+1)
    - cron: "0 7 * * *"   # 8:00 AM Nigeria Time (7:00 AM UTC)
    - cron: "0 13 * * *"  # 2:00 PM Nigeria Time (1:00 PM UTC)
    - cron: "0 17 * * *"  # 6:00 PM Nigeria Time (5:00 PM UTC)
    - cron: "0 23 * * *"  # 11:00 PM Nigeria Time (11:00 PM UTC)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Permissions are granted per job below: run-pipeline needs contents:write
# (data commit) and issues:write (failure alerts); deploy-pages hands its
# token to a third-party deploy action, so it carries contents:write only.

# Serialize runs: two overlapping runs both commit to main, and the slower one
# is rejected as non-fast-forward (a manual trigger near a cron slot did exactly
# this on run 30806786258). cancel-in-progress stays false because a cancelled
# run would abandon articles mid-analysis after their LLM quota was already
# spent, and the Sheets writes are not transactional.
concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write   # the failure step files/updates a pipeline-failure issue
    # Hard ceiling: a hung LLM provider used to hold the job for the
    # 6-hour Actions default. Normal runs finish well inside 30 minutes
    # even with the per-article rate-limit sleeps.
    timeout-minutes: 90
    # Exposes the SHA this run actually committed, so deploy-pages can check
    # that exact commit out instead of a floating `main` ref. Without this,
    # deploy-pages's checkout of `main` raced the push above closely enough
    # that it consistently resolved to the *previous* run's commit instead --
    # verified across three consecutive scheduled runs on 2026-09-22, where
    # every gh-pages deploy shipped the prior cycle's data. The data was
    # never lost, but the live site ran up to one cycle (~6h) stale.
    outputs:
      data_sha: ${{ steps.autocommit.outputs.commit_hash }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Crawler Pipeline
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          NEWSAPI_KEY_2: ${{ secrets.NEWSAPI_KEY_2 }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          # Declared in config and consumed by fetch_gnews(), but never
          # passed here -- the adapter was a permanent no-op in production
          # while appearing active in code and docs. Empty secret = still a
          # clean skip.
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          NVIDIA_MODEL_FALLBACK: ${{ vars.NVIDIA_MODEL_FALLBACK }}
          SEED_DEMO_PSC: ${{ vars.SEED_DEMO_PSC || 'false' }}
          SEED_DEMO_ARTICLES: ${{ vars.SEED_DEMO_ARTICLES || 'false' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          # Optional: a Slack/Discord-style webhook that receives this
          # run's high-risk articles. Empty secret = clean skip.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          # Optional: an ntfy.sh topic URL (e.g. https://ntfy.sh/<private
          # topic>) for phone push alerts on the same high-risk records.
          # Empty secret = clean skip. See docs/NOTIFICATIONS.md.
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          python run_pipeline.py

      - name: Commit and Push Data Updates to Main
        # Runs on failure too (not on cancel): when the pipeline raises after
        # writing exports or eval captures, skipping this step used to discard
        # them with the runner while the Sheets rows they mirror survived --
        # the repo and the database silently diverged.
        if: success() || failure()
        id: autocommit
        # Third-party actions pinned to commit SHAs so a moved tag cannot
        # inject code into a workflow that holds a contents:write token
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "Automated AURA database updates [skip ci]"
          # evals/corpus/ belongs here too. run_pipeline.capture_eval_input
          # samples article inputs into it on every run, and this pattern is
          # what decides whether any of that survives: the runner's filesystem
          # is discarded when the job ends, so a file outside the pattern is
          # written and then thrown away. It was, on every run for two days --
          # the capture worked and the samples evaporated, which made the claim
          # that a corpus would accumulate on its own quietly false.
          file_pattern: "backend/app/static/data/* evals/corpus/*"

      # Morning email briefing: only after the 07:00 UTC run (08:00 Lagos),
      # composed from the data files this run just wrote. Opt-in via SMTP
      # secrets -- the script exits 0 with a log line when they are unset.
      # continue-on-error because a mail-provider outage must not mark the
      # pipeline run red or file a pipeline-failure issue; the step's own
      # log still shows the failure. See docs/NOTIFICATIONS.md for setup.
      - name: Send the morning email briefing
        if: github.event.schedule == '0 7 * * *'
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: python scripts/send_morning_email.py

      # A red run is only useful if someone sees it. The 2026-07-30 outage ran
      # for days unnoticed. Reuses a single open issue so repeated failures
      # comment rather than spam new issues.
      #
      # cancelled() is in the condition because failure() alone does not cover
      # it: GitHub skips `if: failure()` steps when a job is cancelled, running
      # only always() and cancelled(). Run 31125860045 was cancelled 15 minutes
      # in on 2026-08-06 and filed nothing, which is the worst case to stay
      # quiet about -- see the concurrency note above. A cancelled run is the
      # one outcome that can leave partial state, so it is the one that most
      # needs to be seen.
      - name: Raise an issue when the run does not complete
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          # Idempotent: gh issue create fails if the label does not exist yet
          gh label create pipeline-failure --color B60205 \
            --description "Automated scheduler run failed or was cancelled" 2>/dev/null || true

          # A cancellation is not a failure and needs the opposite advice. A
          # failure means a step raised and the guards held; a cancellation
          # means the job was stopped part-way with no error at all, so the
          # question is what was already written, not what went wrong.
          if [ "$OUTCOME" = "cancelled" ]; then
            HEADLINE="The scheduled pipeline was cancelled before it finished."
            ADVICE="Nothing raised an error -- the job was stopped part-way, so treat this as
          possible partial state rather than a clean abort. Articles may have been analysed,
          spending their LLM quota, without their rows being written, and the Sheets writes are
          not transactional. Compare the Sheets tabs and \`backend/app/static/data/\` against the
          run timestamp before re-running, so a half-written cycle is not silently doubled.

          If nobody cancelled this by hand, it was most likely the runner being reclaimed."
          else
            HEADLINE="The scheduled pipeline failed."
            ADVICE="Check the \`Run Crawler Pipeline\` step first. A \`LLMCascadeError\` means every
          configured LLM provider failed and nothing was published — that is the guard
          working, not data loss. A push rejection instead means the data was generated
          but a concurrent run committed first."
          fi

          EXISTING=$(gh issue list --label pipeline-failure --state open \
            --json number --jq '.[0].number // empty')
          BODY="$HEADLINE

          **Run:** $RUN_URL
          **Commit:** \`${{ github.sha }}\`
          **Trigger:** ${{ github.event_name }}
          **Outcome:** \`$OUTCOME\`

          $ADVICE"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "Pipeline alert: scheduled run did not complete" \
              --label pipeline-failure \
              --body "$BODY"
          fi

  deploy-pages:
    name: Deploy to gh-pages
    needs: run-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shares the pages-deploy concurrency group with deploy_pages.yml: the
    # deploy used to run inside run-pipeline under the news-pipeline group,
    # so a docs push and a scheduler run could push gh-pages concurrently
    # and race. The data commit lands on main with [skip ci], which is why
    # deploy_pages.yml cannot cover this path itself. Newest deploy wins,
    # so cancelling an in-progress one is safe.
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout the commit run-pipeline just pushed
        uses: actions/checkout@v4
        with:
          # Pinned to the exact SHA run-pipeline produced (job output above),
          # not a floating `main` ref -- see the outputs comment on
          # run-pipeline for why. Falls back to `main` only if that output is
          # ever empty (e.g. the commit step didn't run for some reason).
          ref: ${{ needs.run-pipeline.outputs.data_sha || 'main' }}
          # Full history so the promoted `production` tag can be built.
          fetch-depth: 0

      # The site is built from this run's data: pages are rendered at build
      # time, so a data refresh is a rebuild. Two copies:
      #   gh-pages          the test site, built from main's code
      #   cloudflare-pages  production, built from the PROMOTED code (the
      #                     `production` tag) so untested changes on main
      #                     never reach users through a data refresh.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore logo cache
        uses: actions/cache@v6
        with:
          path: web/public/logos
          key: logos-${{ hashFiles('web/src/lib/logos.ts') }}

      - name: Build the test site
        working-directory: web
        env:
          SITES: github
        run: |
          npm ci --no-audit --no-fund
          ./scripts/build-sites.sh

      - name: Build production (promoted code, this run's data)
        id: production
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/production:refs/tags/production" || true
          if git rev-parse --verify -q "production^{commit}" >/dev/null; then
            bash web/scripts/build-production.sh production
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No version promoted yet (no production tag): production keeps its current build. Run 'Promote to production'."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the GitHub Pages copy
        # Pinned to a commit SHA so a moved tag cannot inject code into a
        # workflow that holds a contents:write token
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: web/out/github
          branch: gh-pages

      - name: Publish production (cloudflare-pages)
        if: steps.production.outputs.built == 'true'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: out-production
          branch: cloudflare-pages

      # The push-triggered deploy_pages.yml smoke-tests its own deploys, but
      # the data commit lands with [skip ci], so this path -- the one that
      # runs four times a day -- shipped unverified. A truncated or
      # unparseable data file went unnoticed until a human loaded the
      # dashboard. Same checks as deploy_pages.yml's smoke-test job.
      - name: Smoke-test the deployed site
        run: |
          set -euo pipefail
          BASE="https://adejare-ml.github.io/News-Intelligence-System"

          fetch() {
            # Retry across the CDN propagation window (up to ~2 minutes).
            for i in 1 2 3 4 5 6; do
              if curl -fsSL --max-time 30 "$1" -o "$2"; then return 0; fi
              echo "attempt $i failed for $1; retrying in 20s"; sleep 20
            done
            echo "FAILED to fetch $1"; return 1
          }

          fetch "$BASE/" index.html
          grep -q "data-hero" index.html

          for f in latest.json companies.json people.json procurement.json \
                   significant_control.json reports.json; do
            fetch "$BASE/data/$f" "$f"
            python3 -c "import json; json.load(open('$f'))"
            echo "OK data/$f"
          done
          echo "Smoke test passed."
