# One-off: deletes branches whose work is already in main (owner asked for
# this). Removed again in the next commit; it runs only on this push.
name: Delete stale branches
on:
  push:
    branches: [claude/quirky-lamport-vrv4t2]
    paths: [.github/workflows/delete_stale_branches.yml]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches already in main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for b in chore/add-community-files evals/corpus-backfill claude/relaxed-ramanujan-35m99e; do
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b" && echo "deleted $b" || echo "could not delete $b"
          done
