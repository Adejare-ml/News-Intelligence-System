name: Tests

# The repository had 188 assertions and nothing that ran them. The only other
# workflows deploy (push to main) and ingest (cron), so a pull request got no
# checks at all and a regression could only be caught by hand.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A superseded run tells you nothing, so cancel it rather than pay for it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # requirements-ci.txt is the test-suite set: the full runtime list
        # pulled the sentence-transformers -> torch (~2GB CUDA wheels) stack
        # that no test imports (nlp_pipeline.py tolerates its absence).
        # pytest is installed separately rather than added to either
        # requirements file, which are runtime lists with no business
        # carrying a test dependency.
        #
        # The spacy model download that news_scheduler.yml performs is
        # deliberately absent: no test needs it, and it is a slow step.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install pytest ruff

      - name: Lint (syntax and undefined names only)
        # Deliberately the narrow E9/F63/F7/F82 set -- real breakage
        # (syntax errors, undefined names, malformed comparisons), not
        # style. Widening it means relitigating every file in the repo.
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run pytest
        run: pytest -q

      - name: Audit runtime dependencies
        # Advisory, not blocking: a new CVE in a pinned dependency should
        # surface as a visible warning on the PR, not stop unrelated work.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --disable-pip || echo "::warning::pip-audit found known vulnerabilities in requirements.txt (see log above)"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No install step: the runner is plain Node with no dependencies, and the
      # dashboard has no build. See tests/frontend/run.js.
      - name: Run frontend suite
        run: node tests/frontend/run.js

  cache-buster:
    name: Cache-buster check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Advisory: index.html's ?v= tokens are the only cache invalidation the
    # static site has, so shipping a JS/CSS change without bumping one means
    # returning visitors run the cached old code against the new markup.
    # A warning is also the right ceiling -- comment-only edits are fine.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn when shipped assets change without a version bump
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$BASE...$HEAD" -- \
            'backend/app/static/js/*.js' 'backend/app/static/css/*.css')
          if [ -z "$CHANGED" ]; then
            echo "No shipped JS/CSS changed."
            exit 0
          fi
          if git diff "$BASE...$HEAD" -- backend/app/static/index.html | grep -q '?v='; then
            echo "Assets changed and index.html touched a ?v= token."
            exit 0
          fi
          echo "::warning file=backend/app/static/index.html::Shipped JS/CSS changed without a ?v= cache-buster bump in index.html; returning visitors will keep the cached old assets."
          printf 'Changed without a version bump:\n%s\n' "$CHANGED"
          exit 1
