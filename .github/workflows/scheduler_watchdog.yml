name: Scheduler watchdog

# GitHub sometimes drops scheduled runs without a trace (on 2 Nov 2026 the
# 07:00 and 13:00 UTC pipeline runs never started, so no Morning Brief went
# out). This checks, after each pipeline slot, that a run of "AI News
# Intelligence Scheduler" actually started; if none did, it starts one. For
# the morning slot it starts the email edition, so the brief still goes out
# (a later duplicate is harmless: send-brief sends once per Lagos day).
#
# Two chances for the morning slot (07:51 and 08:29 UTC), one for the others.
# A watchdog run can be dropped too, but two independent schedules missing
# the same slot is far rarer than one.
#
# It also opens a pipeline-missed issue when no run has done real work for
# six hours, so a stalled schedule is seen rather than found days later.
# A successful pipeline run closes it.
on:
  schedule:
    - cron: "51 7,13,17,23 * * *"
    - cron: "29 8 * * *"
  workflow_dispatch:

permissions:
  actions: write   # to start the pipeline
  contents: read
  issues: write    # the pipeline-missed alert

concurrency:
  group: scheduler-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the guard script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/scheduler_guard.py
          sparse-checkout-cone-mode: false

      # Runs before the start below, so a run this check starts does not
      # hide the gap it is filling. "Real" uses the guard's rule: queued,
      # running, or longer than two minutes; skipped runs do not count.
      # continue-on-error: a failed alert must not stop the start below.
      - name: Raise an issue when nothing has run for six hours
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # go=true over a six-hour window means no run did real work in it.
          gh run list -R "$REPO" --workflow news_scheduler.yml --limit 30 \
              --json databaseId,createdAt,updatedAt,status,event \
            | python3 scripts/scheduler_guard.py --self-id 0 --window-minutes 360 > decision.txt
          cat decision.txt
          if ! grep -qx "go=true" decision.txt; then
            exit 0
          fi

          gh label create pipeline-missed -R "$REPO" --color D93F0B \
            --description "No pipeline run did real work for six hours" 2>/dev/null || true
          BODY="No run of the news pipeline has done real work in the last six hours
          (runs that skipped themselves in seconds do not count), so at least one slot
          published nothing.

          **Checked by:** $RUN_URL

          Check that the Cloudflare scheduler Worker is deployed and its GITHUB_TOKEN has
          not expired (docs/CLOUDFLARE.md, \"Scheduler\"). This issue closes itself after
          the next successful run."
          EXISTING=$(gh issue list -R "$REPO" --label pipeline-missed --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$REPO" --body "$BODY"
          else
            gh issue create -R "$REPO" --title "Pipeline alert: no run for six hours" \
              --label pipeline-missed --body "$BODY"
          fi

      - name: Start the pipeline if its slot was skipped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The slot this check covers: the latest of 07, 13, 17 and 23 UTC
          # at or before now (before 07:00, yesterday's 23:00).
          HOUR=$((10#$(date -u +%H)))
          SINCE=""
          for SLOT in 23 17 13 7; do
            if [ "$HOUR" -ge "$SLOT" ]; then
              SINCE=$(date -u -d "today $SLOT:00" +%Y-%m-%dT%H:%M:%SZ)
              break
            fi
          done
          if [ -z "$SINCE" ]; then
            SLOT=23
            SINCE=$(date -u -d "yesterday 23:00" +%Y-%m-%dT%H:%M:%SZ)
          fi

          # Any run since the slot counts: scheduled, manual or started by
          # an earlier watchdog check, queued, running or finished.
          STARTED=$(gh run list -R "$REPO" --workflow news_scheduler.yml --limit 30 \
            --json createdAt --jq "[.[] | select(.createdAt >= \"$SINCE\")] | length")
          if [ "$STARTED" -gt 0 ]; then
            echo "The pipeline has started since $SINCE ($STARTED run(s)); nothing to do."
            exit 0
          fi

          EDITION=false
          [ "$SLOT" = "7" ] && EDITION=true
          echo "::warning::No pipeline run since $SINCE: GitHub skipped the scheduled slot. Starting one now (email_edition=$EDITION)."
          gh workflow run news_scheduler.yml -R "$REPO" --ref main -f email_edition="$EDITION"
          {
            echo "### Scheduler watchdog"
            echo
            echo "No pipeline run had started since $SINCE, so this started one (email_edition=$EDITION)."
          } >> "$GITHUB_STEP_SUMMARY"
